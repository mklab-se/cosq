[workspace]
resolver = "2"
members = [
    "crates/cosq",
    "crates/cosq-core",
    "crates/cosq-client",
]

[workspace.package]
version = "1.1.0"
edition = "2024"
authors = ["Kristofer Liljeblad <kristofer@mklab.se>"]
license = "MIT"
repository = "https://github.com/mklab-se/cosq"
rust-version = "1.95"

[workspace.dependencies]
# Internal crates
cosq-core = { version = "1.1.0", path = "crates/cosq-core" }
cosq-client = { version = "1.1.0", path = "crates/cosq-client" }

# CLI
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }

# Async
tokio = { version = "1.53", features = ["full"] }

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Terminal
colored = "3.1"
inquire = "0.9"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Versioning & time
semver = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# URL encoding
urlencoding = "2.1"

# UUID generation
uuid = { version = "1.26", features = ["v4"] }

# Directories
dirs = "7.0"

# Templating
minijinja = "2.24"

# Table output
comfy-table = "8"
reedline = "0.51"

# Regex
regex = "1.13"

# AI
ailloy = { version = "2.1", default-features = false, features = ["config-tui"] }
